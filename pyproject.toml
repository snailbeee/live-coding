[project]
name = "live-coding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thuy LE", email = "lamthuy.lt@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "huggingface-hub==2.4.0",
    "llama-cpp-python==0.3.37",
]

[dependency-groups]
dev = [
    "pyrefly==1.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[project.scripts]
live-coding = "my_pkg:main"

[tool.uv.build-backend]
module-name = "my_pkg"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"


[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]